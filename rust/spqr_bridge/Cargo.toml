[package]
name = "ratchet-spqr-bridge"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[lib]
crate-type = ["staticlib"]

[dependencies]
spqr = { path = "../../third_party/spqr" }
rand = "0.9"
zeroize = "1.8"
# For best-effort mlock/munlock of the secret buffers handed back to C. Already
# present in the lockfile as a transitive dependency; pinned by Cargo.lock.
libc = "0.2"
