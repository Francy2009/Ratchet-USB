name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  # A crypto project's dependencies rot quietly. A weekly run catches a
  # libsodium or toolchain change that breaks the build long before the next
  # time anyone happens to push.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Only the newest run per branch matters; cancel the rest.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep warnings fatal everywhere. The project already builds clean with
  # -Wall -Wextra -Wpedantic; this stops that from silently regressing.
  WARN_FLAGS: "-Wall -Wextra -Wpedantic -Werror"
  # github.workspace is valid at workflow scope. runner.temp is not, and using
  # it here makes GitHub reject the file before any job starts.
  OPENSSL_PREFIX: ${{ github.workspace }}/.openssl

jobs:
  # ---------------------------------------------------------------------
  # The key schedule is checked against vectors produced by an independent
  # Python implementation. That only means anything if the two are still in
  # sync, so regenerate the header and fail on any difference.
  # ---------------------------------------------------------------------
  vectors:
    name: Test vectors are in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Reference implementation reproduces the published RFC vectors
        run: python3 test/vectors/reference.py --check

      - name: Regenerate vectors.hpp and check it matches what is committed
        run: |
          python3 test/vectors/reference.py --emit > /tmp/vectors.hpp
          if ! diff -u test/vectors/vectors.hpp /tmp/vectors.hpp; then
            echo
            echo "test/vectors/vectors.hpp is out of date with reference.py."
            echo "Regenerate it with:"
            echo "  python3 test/vectors/reference.py --emit > test/vectors/vectors.hpp"
            exit 1
          fi

  spqr-tests:
    name: Vendored SPQR and bridge tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal

      - name: Test Signal SPQR
        run: cargo test --manifest-path third_party/spqr/Cargo.toml --locked

      - name: Test the Rust bridge
        run: cargo test --manifest-path rust/spqr_bridge/Cargo.toml --locked

      - name: Check locked dependency license inventory
        run: python3 ci/check-rust-licenses.py --check

  rust-advisories:
    name: RustSec advisories for both lockfiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install checksum-verified cargo-audit
        run: |
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            'https://github.com/rustsec/rustsec/releases/download/cargo-audit/v0.22.2/cargo-audit-x86_64-unknown-linux-gnu-v0.22.2.tgz' \
            -o "$RUNNER_TEMP/cargo-audit.tgz"
          echo "ab28a1bdb54db4d5d8ad5981cf1f959410370b3d28250dbd35f6a44248620e39  $RUNNER_TEMP/cargo-audit.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/cargo-audit.tgz" -C "$RUNNER_TEMP"

      - name: Check the bridge and vendored SPQR locks
        run: |
          audit="$RUNNER_TEMP/cargo-audit-x86_64-unknown-linux-gnu-v0.22.2/cargo-audit"
          "$audit" audit --file rust/spqr_bridge/Cargo.lock
          "$audit" audit --file third_party/spqr/Cargo.lock

  # ---------------------------------------------------------------------
  # The main build matrix. Both compilers, both build types -- Debug catches
  # what assertions and unoptimised code catch, Release catches what the
  # optimiser changes.
  # ---------------------------------------------------------------------
  build:
    name: ${{ matrix.compiler }} / ${{ matrix.build_type }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Debug, Release]
        include:
          - compiler: gcc
            cxx: g++
          - compiler: clang
            cxx: clang++
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsodium-dev cmake curl perl make ${{ matrix.compiler }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ env.OPENSSL_PREFIX }}
          key: openssl-3.5.9-${{ runner.os }}-${{ runner.arch }}

      - name: Install pinned OpenSSL 3.5 LTS
        run: ./ci/install-openssl.sh "$OPENSSL_PREFIX"

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DOPENSSL_ROOT_DIR="$OPENSSL_PREFIX"
          -DCMAKE_CXX_FLAGS="$WARN_FLAGS"

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Verify executable hardening
        if: matrix.build_type == 'Release'
        run: ./ci/check-hardening.sh build/ratchet-usb

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: End-to-end smoke test
        run: ./test/smoke.sh build/ratchet-usb

      # The interface cannot be tested by the unit tests past its state
      # machine: raw mode, the passphrase prompts that step outside the frame,
      # and bracketed paste only exist in front of a real terminal. This drives
      # a whole conversation through a pty.
      - name: The interface, driven through a real terminal
        run: python3 test/smoke_ui.py build/ratchet-usb

  # ---------------------------------------------------------------------
  # There are two HKDF implementations in this tree: libsodium's, and the
  # project's own RFC 5869 fallback for releases older than 1.0.19. Ubuntu
  # ships 1.0.18, so the matrix above only ever compiles the fallback. This
  # job builds a newer libsodium so the other path gets exercised too, and
  # checks both derive the same keys from the same vectors.
  # ---------------------------------------------------------------------
  libsodium-native-hkdf:
    name: libsodium 1.0.22 (native HKDF path)
    runs-on: ubuntu-latest
    env:
      SODIUM_VERSION: 1.0.22
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake curl perl make gcc

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ env.OPENSSL_PREFIX }}
          key: openssl-3.5.9-${{ runner.os }}-${{ runner.arch }}

      - name: Cache the libsodium build
        id: sodium-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/sodium-prefix
          key: sodium-${{ env.SODIUM_VERSION }}-${{ runner.os }}

      - name: Build libsodium from source
        if: steps.sodium-cache.outputs.cache-hit != 'true'
        env:
          # SHA-256 published with the upstream 1.0.22 release asset.
          SODIUM_SHA256: adbdd8f16149e81ac6078a03aca6fc03b592b89ef7b5ed83841c086191be3349
        run: |
          curl -sSL -o sodium.tar.gz \
            "https://github.com/jedisct1/libsodium/releases/download/${SODIUM_VERSION}-RELEASE/libsodium-${SODIUM_VERSION}.tar.gz"
          echo "${SODIUM_SHA256}  sodium.tar.gz" | sha256sum -c -
          tar xzf sodium.tar.gz
          cd "libsodium-${SODIUM_VERSION}"
          ./configure --prefix="$HOME/sodium-prefix" --disable-dependency-tracking
          make -j"$(nproc)"
          make install

      - name: Configure against it
        run: |
          export PKG_CONFIG_PATH="$HOME/sodium-prefix/lib/pkgconfig"
          ./ci/install-openssl.sh "$OPENSSL_PREFIX"
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DOPENSSL_ROOT_DIR="$OPENSSL_PREFIX" \
            -DCMAKE_CXX_FLAGS="$WARN_FLAGS"

      - name: Confirm the native HKDF path was actually selected
        # Without this the job is worthless: if detection breaks, CMake
        # quietly compiles the fallback again and everything still passes,
        # leaving libsodium's own HKDF untested while the badge stays green.
        run: |
          if ! grep -q RATCHET_HAVE_SODIUM_HKDF \
               build/CMakeFiles/ratchet_core.dir/flags.make; then
            echo "RATCHET_HAVE_SODIUM_HKDF is not defined -- this build fell"
            echo "back to the bundled HKDF, so it is not testing what this"
            echo "job exists to test."
            exit 1
          fi

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Unit tests
        run: |
          export LD_LIBRARY_PATH="$HOME/sodium-prefix/lib"
          ctest --test-dir build --output-on-failure

      - name: End-to-end smoke test
        run: |
          export LD_LIBRARY_PATH="$HOME/sodium-prefix/lib"
          ./test/smoke.sh build/ratchet-usb

  # ---------------------------------------------------------------------
  # This code does its own buffer arithmetic on key material. Sanitizers are
  # not optional here.
  # ---------------------------------------------------------------------
  sanitizers:
    name: AddressSanitizer + UndefinedBehaviorSanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsodium-dev cmake curl perl make g++

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ env.OPENSSL_PREFIX }}
          key: openssl-3.5.9-${{ runner.os }}-${{ runner.arch }}

      - name: Install pinned OpenSSL 3.5 LTS
        run: ./ci/install-openssl.sh "$OPENSSL_PREFIX"

      # GCC rather than clang: its sanitizer runtimes ship with the compiler
      # package, whereas clang's live in a separate libclang-rt-*-dev that is
      # easy to end up without. The checks are the same either way.
      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=g++
          -DOPENSSL_ROOT_DIR="$OPENSSL_PREFIX"
          -DCMAKE_CXX_FLAGS="$WARN_FLAGS -fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all -g"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Unit tests
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1:detect_stack_use_after_return=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build --output-on-failure

      - name: End-to-end smoke test
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1:detect_stack_use_after_return=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ./test/smoke.sh build/ratchet-usb

      - name: The interface, driven through a real terminal
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1:detect_stack_use_after_return=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: python3 test/smoke_ui.py build/ratchet-usb

  # ---------------------------------------------------------------------
  # Valgrind catches reads of uninitialised memory that ASan does not, which
  # for key material is exactly the class of bug worth catching.
  # ---------------------------------------------------------------------
  valgrind:
    name: Valgrind
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsodium-dev cmake valgrind curl perl make g++

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ env.OPENSSL_PREFIX }}
          key: openssl-3.5.9-${{ runner.os }}-${{ runner.arch }}

      - name: Install pinned OpenSSL 3.5 LTS
        run: ./ci/install-openssl.sh "$OPENSSL_PREFIX"

      - name: Configure and build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug \
            -DOPENSSL_ROOT_DIR="$OPENSSL_PREFIX" \
            -DCMAKE_CXX_FLAGS="$WARN_FLAGS -g"
          cmake --build build -j"$(nproc)"

      - name: Unit tests under Valgrind
        run: |
          valgrind --error-exitcode=99 --leak-check=full \
                   --errors-for-leak-kinds=definite -q \
                   ./build/test/ratchet_tests

  # ---------------------------------------------------------------------
  # Three of this project's parsers run on input nobody vouched for: a pasted
  # contact card, a pasted message envelope, and a vault header that is acted
  # on before the tag covering it has been checked. The unit tests show that
  # well-formed input round-trips; this shows that malformed input is refused
  # rather than mishandled.
  #
  # A short run per push is not a fuzzing campaign -- it is a regression net
  # over the committed corpus, which grows every time something interesting
  # turns up. The weekly schedule is what gets a long run.
  # ---------------------------------------------------------------------
  fuzz:
    name: Fuzz the untrusted-input parsers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsodium-dev cmake clang libclang-rt-dev curl perl make

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ env.OPENSSL_PREFIX }}
          key: openssl-3.5.9-${{ runner.os }}-${{ runner.arch }}

      - name: Install pinned OpenSSL 3.5 LTS
        run: ./ci/install-openssl.sh "$OPENSSL_PREFIX"

      - name: Configure
        run: >
          cmake -S . -B build-fuzz
          -DRATCHET_BUILD_FUZZERS=ON
          -DRATCHET_BUILD_TESTS=OFF
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_BUILD_TYPE=Debug
          -DOPENSSL_ROOT_DIR="$OPENSSL_PREFIX"

      - name: Build
        run: cmake --build build-fuzz -j"$(nproc)"

      # Every committed corpus entry is replayed on every run, so an input that
      # once found a bug can never quietly stop being checked.
      - name: Replay the committed corpora
        run: |
          ./build-fuzz/test/fuzz/fuzz_parsers test/fuzz/corpus -runs=0
          ./build-fuzz/test/fuzz/fuzz_session test/fuzz/corpus_session -runs=0
          ./build-fuzz/test/fuzz/fuzz_ui_keys test/fuzz/corpus_ui -runs=0
          ./build-fuzz/test/fuzz/fuzz_cli test/fuzz/corpus_cli -runs=0

      - name: Fuzz the protocol state machine
        env:
          DURATION: ${{ github.event_name == 'schedule' && '600' || '60' }}
        # Separate from the parser run below because it is checking something
        # else: not that malformed input is refused, but that no interleaving
        # of sends, deliveries, alterations and repeats ever gets a message to
        # decrypt when it should not. A violation aborts.
        run: |
          mkdir -p .fuzz-out
          ./build-fuzz/test/fuzz/fuzz_session .fuzz-out test/fuzz/corpus_session \
            -max_total_time="$DURATION" -rss_limit_mb=2048 -print_final_stats=1

      - name: Fuzz
        env:
          # 10 minutes on the weekly run, 60 seconds on an ordinary push.
          DURATION: ${{ github.event_name == 'schedule' && '600' || '60' }}
        # Two directories, and the order matters: libFuzzer writes the new
        # inputs it discovers into the *first* one. Pointing that at a scratch
        # directory keeps test/fuzz/corpus read-only -- otherwise a single run
        # dumps a few hundred mutated blobs into the tree, and they get
        # committed by whoever runs `git add` next. Growing the corpus is a
        # deliberate act: pick the input that found something and add it.
        run: |
          mkdir -p .fuzz-out
          ./build-fuzz/test/fuzz/fuzz_parsers .fuzz-out test/fuzz/corpus \
            -max_total_time="$DURATION" -rss_limit_mb=2048 -print_final_stats=1

      - name: Fuzz the interface's key handling
        env:
          DURATION: ${{ github.event_name == 'schedule' && '600' || '60' }}
        # What a terminal hands over includes whatever was pasted into the
        # window, so these bytes are as untrusted as the ones above. The
        # harness asserts the two properties the read loop depends on: that
        # decoding always makes progress, and that no sequence of keys can
        # produce a frame bigger than the screen or one carrying an escape
        # byte.
        run: |
          mkdir -p .fuzz-out
          ./build-fuzz/test/fuzz/fuzz_ui_keys .fuzz-out test/fuzz/corpus_ui \
            -max_total_time="$DURATION" -rss_limit_mb=2048 -print_final_stats=1

      - name: Fuzz the command-line grammar
        env:
          DURATION: ${{ github.event_name == 'schedule' && '600' || '60' }}
        # The argument parser is what every command is gated on. A malformed
        # command line may be rejected, but it must never crash or hang.
        run: |
          mkdir -p .fuzz-out
          ./build-fuzz/test/fuzz/fuzz_cli .fuzz-out test/fuzz/corpus_cli \
            -max_total_time="$DURATION" -rss_limit_mb=2048 -print_final_stats=1

      - name: Upload any input that failed
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: fuzz-findings
          path: |
            crash-*
            oom-*
            timeout-*
          if-no-files-found: ignore

  # ---------------------------------------------------------------------
  # Static analysis.
  # ---------------------------------------------------------------------
  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsodium-dev cmake clang-tidy curl perl make g++ \
            qt6-base-dev libgl1-mesa-dev

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ env.OPENSSL_PREFIX }}
          key: openssl-3.5.9-${{ runner.os }}-${{ runner.arch }}

      - name: Install pinned OpenSSL 3.5 LTS
        run: ./ci/install-openssl.sh "$OPENSSL_PREFIX"

      - name: Generate the compilation database
        # Qt6 is installed above, so the GUI sources are part of the database.
        # The CLI-only build remains covered by the no-gui job.
        run: >
          cmake -S . -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DRATCHET_BUILD_GUI=ON
          -DOPENSSL_ROOT_DIR="$OPENSSL_PREFIX"

      - name: Run clang-tidy
        # The .cpp files are passed in; the headers are analysed through the
        # translation units that include them, per HeaderFilterRegex in
        # .clang-tidy. The check list and warnings-as-errors live in that file
        # rather than on this command line, so running the linter locally
        # gives the same answer CI does. src stays in the set; gui is added.
        run: find src gui -name '*.cpp' -print0 | xargs -0 clang-tidy -p build --quiet

  # ---------------------------------------------------------------------
  # Coverage is a report, not a gate: it shows which branches the suite never
  # reaches. The vendored tree and the tests themselves are excluded.
  # ---------------------------------------------------------------------
  coverage:
    name: Coverage report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libsodium-dev cmake curl perl make g++ gcovr

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ env.OPENSSL_PREFIX }}
          key: openssl-3.5.9-${{ runner.os }}-${{ runner.arch }}

      - name: Install pinned OpenSSL 3.5 LTS
        run: ./ci/install-openssl.sh "$OPENSSL_PREFIX"

      - name: Configure with coverage
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DRATCHET_BUILD_GUI=OFF
          -DOPENSSL_ROOT_DIR="$OPENSSL_PREFIX"
          -DCMAKE_CXX_FLAGS="--coverage -O0 -g"
          -DCMAKE_EXE_LINKER_FLAGS="--coverage"

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: End-to-end smoke test
        run: ./test/smoke.sh build/ratchet-usb

      - name: The interface, driven through a real terminal
        run: python3 test/smoke_ui.py build/ratchet-usb

      - name: Generate the report
        run: |
          mkdir -p coverage-report
          gcovr --root . build --filter 'src/' --exclude 'test/' --exclude 'third_party/' \
            --html --html-details -o coverage-report/index.html
          gcovr --root . build --filter 'src/' --exclude 'test/' --exclude 'third_party/' \
            --txt -o coverage-report/summary.txt
          cat coverage-report/summary.txt

      - name: Upload the coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: coverage-report
          path: coverage-report
          if-no-files-found: error

  # ---------------------------------------------------------------------
  # The CLI must build and pass its tests when Qt6 is not installed at all;
  # the GUI is optional.
  # ---------------------------------------------------------------------
  no-gui:
    name: CLI without Qt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsodium-dev cmake curl perl make g++

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ env.OPENSSL_PREFIX }}
          key: openssl-3.5.9-${{ runner.os }}-${{ runner.arch }}

      - name: Install pinned OpenSSL 3.5 LTS
        run: ./ci/install-openssl.sh "$OPENSSL_PREFIX"

      - name: Configure without the GUI
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DRATCHET_BUILD_GUI=OFF
          -DOPENSSL_ROOT_DIR="$OPENSSL_PREFIX"

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: End-to-end smoke test
        run: ./test/smoke.sh build/ratchet-usb

  # ---------------------------------------------------------------------
  # The GUI helper, payload framing, structured-output parser and the real
  # window against a fake CLI. These build without the installed GUI target so
  # the job stays a widget/test build; launch tests run offscreen.
  # ---------------------------------------------------------------------
  gui-tests:
    name: GUI helper and launch tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libsodium-dev cmake curl perl make g++ qt6-base-dev libgl1-mesa-dev

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ env.OPENSSL_PREFIX }}
          key: openssl-3.5.9-${{ runner.os }}-${{ runner.arch }}

      - name: Install pinned OpenSSL 3.5 LTS
        run: ./ci/install-openssl.sh "$OPENSSL_PREFIX"

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DRATCHET_BUILD_GUI=OFF
          -DOPENSSL_ROOT_DIR="$OPENSSL_PREFIX"

      - name: Build the GUI tests
        run: >
          cmake --build build -j"$(nproc)"
          --target ratchet_gui_tests
          ratchet_gui_payload_tests
          ratchet_gui_output_tests
          ratchet_gui_launch_tests

      - name: Run the GUI tests
        run: ctest --test-dir build -R 'ratchet_gui' --output-on-failure

  # ---------------------------------------------------------------------
  # A single gate for branch protection to point at, so adding a job above
  # does not mean remembering to update a required-checks list.
  # ---------------------------------------------------------------------
  ci:
    name: CI
    if: always()
    needs:
      - vectors
      - spqr-tests
      - rust-advisories
      - build
      - libsodium-native-hkdf
      - sanitizers
      - valgrind
      - fuzz
      - clang-tidy
      - no-gui
      - gui-tests
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - name: All required jobs passed
        run: echo "ok"
